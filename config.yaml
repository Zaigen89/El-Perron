# Configuración de El Perrón - bot de scalping BTC (paper trading)

symbol: BTCUSDT
interval: 15m           # velas base. En 1m/5m el ATR de BTC no cubre las comisiones con margen (ver `diagnose`)
trend_interval: 1h      # velas para el filtro de tendencia

data:
  base_url: https://api.binance.com      # alternativas: https://data-api.binance.vision , https://api.binance.us
  dir: data

capital:
  initial: 10000.0      # USDT ficticios

fees:
  taker_pct: 0.04       # % por lado (Binance futuros taker). Spot sería 0.10; maker ~0.02
  slippage_pct: 0.01    # % de deslizamiento asumido por lado

strategy:
  name: value_pullback_v3   # alternativa: scalping_pullback_v2 (rupturas; sin ventaja en datos reales)
  ema_fast: 9
  ema_slow: 21
  ema_trend: 50         # sobre velas de tendencia (1h)
  rsi_period: 7
  rsi_oversold: 45      # nivel de retroceso en tendencia alcista (no es sobreventa clásica)
  rsi_overbought: 55    # nivel de rebote en tendencia bajista
  pullback_lookback: 5  # velas hacia atrás donde buscar el retroceso
  min_body_ratio: 0.4   # cuerpo de la vela gatillo >= 40% de su rango
  atr_period: 14
  volume_ma: 20
  volume_min_ratio: 0.8 # en un retroceso el volumen suele ser bajo; solo se exige que no esté muerto
  atr_min_pct: 0.08     # ATR mínimo en % del precio (evita mercado muerto)
  atr_max_pct: 0.80     # ATR máximo en % del precio (evita caos)
  max_bars_in_trade: 12 # salida por tiempo (12 velas de 15m = 3 horas)
  min_tp_cost_ratio: 2.0 # el objetivo debe ser >= 2x el costo ida y vuelta (comisiones+slippage)
  use_vwap_filter: true
  # --- value_pullback_v3 ---
  rr: 2.0               # objetivo = 2x la distancia del stop
  swing_lookback: 4     # el stop va debajo del mínimo de las últimas 4 velas...
  stop_buffer_atr: 0.25 # ...menos un colchón de 0.25 ATR
  min_stop_atr: 1.0     # nunca menos de 1 ATR (fuera del ruido de una vela)
  max_stop_atr: 3.0     # si el retroceso fue más profundo que 3 ATR, no se opera
  value_touch_pct: 0.05 # tolerancia para "tocó" la EMA21 / VWAP
  max_dist_vwap_pct: 0.35 # no entrar extendido respecto al VWAP
  rsi_pb_low: 35        # zona de RSI del retroceso (long); el short usa el espejo
  rsi_pb_high: 60
  # --- scalping_pullback_v2 (solo si strategy.name = scalping_pullback_v2) ---
  tp_atr: 2.0
  sl_atr: 1.0

risk:
  risk_per_trade_pct: 0.5   # % del capital arriesgado por operación
  max_position_pct: 50.0    # tamaño máximo de posición en % del capital
  max_daily_loss_pct: 2.0   # se detiene el día al perder esto
  max_trades_per_day: 30
  cooldown_bars_after_loss: 3

llm:
  enabled: false            # también se activa con --llm en la CLI
  model: claude-opus-5-5    # más barato: claude-sonnet-5-5 o claude-haiku-5-5
  effort: low               # low|medium|high - low es suficiente para decisiones rápidas
  max_calls_per_run: 200    # tope de llamadas por backtest (control de costo)
  context_bars: 30          # velas recientes que ve el modelo
  knowledge_dir: knowledge  # tus ideas de trading en .md
  memory_dir: memory        # lecciones aprendidas y journal
  cache: true               # cachea decisiones por contexto para no pagar dos veces lo mismo
  size_multiplier_bounds: [0.0, 1.5]
  sl_multiplier_bounds: [0.7, 1.5]
  tp_multiplier_bounds: [0.7, 2.0]

paper:
  poll_seconds: 15
  log_dir: memory
